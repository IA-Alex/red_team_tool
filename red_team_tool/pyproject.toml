[project]
name = "redteamcrew"
version = "0.1.0"
description = "Herramienta de red team orquestada con LangGraph y LLM directo"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph>=1.2.11",
    "structlog>=26.1.0",
    "PyYAML>=6.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "markdown>=3.10.3",
    "arq>=0.26",
    "redis>=5.0",
    "networkx>=3.4.2",
    "bleach>=6.4.0",
]

[project.scripts]
redteamcrew = "redteamcrew.main:run"
run_crew = "redteamcrew.main:run"
redteamcrew-api = "redteamcrew.api.__main__:main"
redteamcrew-worker = "redteamcrew.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
    "types-PyYAML>=6.0",
]
[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "__pypackages__",
    "_build",
    "build",
    "dist",
]

# Same as Black.
line-length = 88

[tool.ruff.lint]
# Enable all typical linting rules
select = ["E", "F", "W", "I", "N", "PL"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
